org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false

kotlin.code.style=official

# Native build tuning.
# VARUN_ABIS controls which ABIs get a llama.cpp build. arm64-v8a covers every
# Android phone sold since ~2017; x86_64 is only needed for emulator testing and
# roughly doubles CI time, so it is opt-in.
VARUN_ABIS=arm64-v8a
VARUN_NDK_VERSION=27.2.12479018
VARUN_CMAKE_VERSION=3.22.1
# Set to a local llama.cpp checkout to build fully offline (no FetchContent).
VARUN_LLAMA_CPP_SRC=
